name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Prepare portfolio files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download portfolio-assets --repo "$GITHUB_REPOSITORY" --pattern yoocamdoit.zip --output site.zip
          unzip -q site.zip -d public
          test -f public/index.html
          test -f public/media/howfar.mp4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
